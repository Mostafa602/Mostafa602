    <g clip-path="url(#c7)"><text class="m" x="44" y="286"><tspan fill="#5EEAD4">  based</tspan><tspan fill="#475569">:     </tspan><tspan fill="#64748B">"</tspan><tspan fill="#CBD5E1">6th of October City, Giza, Egypt</tspan><tspan fill="#64748B">"</tspan><tspan fill="#475569">,</tspan></text></g>
    <g clip-path="url(#c8)"><text class="m" x="44" y="314"><tspan fill="#5EEAD4">  available</tspan><tspan fill="#475569">: </tspan><tspan fill="#4ADE80">true</tspan><tspan fill="#475569">,</tspan></text></g>
    <g clip-path="url(#c9)"><text class="m" x="44" y="342"><tspan fill="#475569">};</tspan></text></g>

    <text class="m" x="44" y="408"><tspan fill="#475569">$ </tspan></text>
