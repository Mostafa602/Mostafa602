    <clipPath id="c6"><rect x="44" y="240" height="24" width="0"><animate attributeName="width" dur="22s" repeatCount="indefinite" values="0;0;830;830;0;0" keyTimes="0;0.415;0.460;0.950;0.975;1" calcMode="linear"/></rect></clipPath>
