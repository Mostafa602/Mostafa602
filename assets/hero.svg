<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Mostafa Mohamed Anwer - Software Engineer, Full-Stack Web Developer">
  <title>Mostafa Mohamed Anwer - Software Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070B14"/>
      <stop offset="55%"  stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0D1A2B"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7DD3FC">
        <animate attributeName="stop-color" values="#7DD3FC;#A78BFA;#5EEAD4;#7DD3FC" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#E2E8F0">
        <animate attributeName="stop-color" values="#E2E8F0;#F1F5F9;#E2E8F0" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#5EEAD4;#7DD3FC;#A78BFA" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#93C5FD" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect x="0" y="0" width="1000" height="300" rx="20"/></clipPath>

    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <ellipse cx="180" cy="70" rx="300" ry="180" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 90 40; -40 25; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="860" cy="240" rx="280" ry="170" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -80 -45; 45 -20; 0 0" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="540" cy="30" rx="240" ry="130" fill="url(#glowC)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 50 55; -55 20; 0 0" dur="25s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#BFDBFE">
      <circle cx="88"  cy="232" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="152" cy="58"  r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.7;0.1;0.7"   dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="316" cy="252" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.1;0.75;0.1"  dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="672" cy="52"  r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.8;0.15;0.8"  dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="918" cy="106" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2"   dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="762" cy="272" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.65;0.1;0.65" dur="6.1s" repeatCount="indefinite"/></circle>
      <circle cx="446" cy="34"  r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1"   dur="4.1s" repeatCount="indefinite"/></circle>
    </g>

    <g class="mono" font-size="14">
      <text x="64" y="76"><tspan fill="#64748B">mostafa@dev</tspan><tspan fill="#475569"> : </tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#475569"> $ </tspan><tspan fill="#5EEAD4">git config user.name</tspan></text>
    </g>

    <text class="sans" x="64" y="150" font-size="52" font-weight="800" letter-spacing="-1.2" fill="url(#nameGrad)">Mostafa Mohamed Anwer</text>

    <rect x="64" y="170" width="470" height="2.5" rx="1.25" fill="url(#rule)"/>

    <text class="sans" x="64" y="204" font-size="19" font-weight="600" fill="#CBD5E1">Software Engineer<tspan fill="#475569">  //  </tspan>Full-Stack Web Developer</text>

    <text class="mono" x="64" y="232" font-size="13" fill="#64748B">CS &amp; AI, Cairo University  &#183;  GPA 3.61 / 4.00  &#183;  Giza, Egypt</text>

    <g class="mono" font-size="12.5" font-weight="600">
      <g><rect x="64"  y="248" width="86"  height="28" rx="14" fill="#0EA5E9" fill-opacity="0.13" stroke="#38BDF8" stroke-opacity="0.45"/><text x="107" y="266.5" text-anchor="middle" fill="#7DD3FC">React</text></g>
      <g><rect x="158" y="248" width="112" height="28" rx="14" fill="#3B82F6" fill-opacity="0.13" stroke="#60A5FA" stroke-opacity="0.45"/><text x="214" y="266.5" text-anchor="middle" fill="#93C5FD">TypeScript</text></g>
      <g><rect x="278" y="248" width="92"  height="28" rx="14" fill="#8B5CF6" fill-opacity="0.13" stroke="#A78BFA" stroke-opacity="0.45"/><text x="324" y="266.5" text-anchor="middle" fill="#C4B5FD">Next.js</text></g>
      <g><rect x="378" y="248" width="92"  height="28" rx="14" fill="#10B981" fill-opacity="0.13" stroke="#34D399" stroke-opacity="0.45"/><text x="424" y="266.5" text-anchor="middle" fill="#6EE7B7">Node.js</text></g>
      <g><rect x="478" y="248" width="60"  height="28" rx="14" fill="#14B8A6" fill-opacity="0.13" stroke="#5EEAD4" stroke-opacity="0.45"/><text x="508" y="266.5" text-anchor="middle" fill="#99F6E4">Go</text></g>
      <g><rect x="546" y="248" width="98"  height="28" rx="14" fill="#22C55E" fill-opacity="0.13" stroke="#4ADE80" stroke-opacity="0.45"/><text x="595" y="266.5" text-anchor="middle" fill="#86EFAC">MongoDB</text></g>
      <g><rect x="652" y="248" width="82"  height="28" rx="14" fill="#0EA5E9" fill-opacity="0.13" stroke="#38BDF8" stroke-opacity="0.45"/><text x="693" y="266.5" text-anchor="middle" fill="#7DD3FC">Docker</text></g>
    </g>

    <g transform="translate(848,150)" fill="none">
      <circle r="96" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1"/>
      <circle r="66" stroke="#A78BFA" stroke-opacity="0.18" stroke-width="1"/>
      <circle r="36" stroke="#5EEAD4" stroke-opacity="0.20" stroke-width="1"/>
      <circle r="9" fill="#38BDF8" fill-opacity="0.85" stroke="none">
        <animate attributeName="r" values="8;11;8" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite"/>
        <circle cx="96" cy="0" r="4.5" fill="#7DD3FC" stroke="none"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="140 0 0" to="-220 0 0" dur="8s" repeatCount="indefinite"/>
        <circle cx="66" cy="0" r="4" fill="#C4B5FD" stroke="none"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="250 0 0" to="610 0 0" dur="5.5s" repeatCount="indefinite"/>
        <circle cx="36" cy="0" r="3.5" fill="#99F6E4" stroke="none"/></g>
    </g>

    <rect x="-320" y="0" width="320" height="300" fill="url(#sweep)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1360 0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="19.25" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
</svg>
